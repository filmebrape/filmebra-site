<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proyecto Norte — Estrategia de Comunicaciones</title>
  <style>
    @font-face {
      font-family: 'NeueHaas';
      src: url('NeueHaasDisplayBold.ttf') format('truetype');
      font-weight: 700;
    }
    @font-face {
      font-family: 'NeueHaas';
      src: url('NeueHaasDisplayRoman.ttf') format('truetype');
      font-weight: 400;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #FF4769;
      font-family: 'NeueHaas', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* HEADER */
    .header {
      position: relative;
      padding: 48px 0 0 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .chevron {
      position: absolute;
      top: 0;
      right: 0;
      width: 220px;
      opacity: 0.85;
    }

    .logo {
      width: 280px;
      z-index: 1;
    }

    /* DOCUMENTO SECTION */
    .documento {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 60px;
      padding: 80px 60px;
      max-width: 900px;
      margin: 0 auto;
    }

    .documento-texto {
      flex: 1;
    }

    .documento-texto h2 {
      font-family: 'NeueHaas', sans-serif;
      font-weight: 700;
      font-size: 22px;
      color: #ffffff;
      letter-spacing: 0.02em;
      margin-bottom: 6px;
    }

    .documento-texto h3 {
      font-family: 'NeueHaas', sans-serif;
      font-weight: 700;
      font-size: 16px;
      color: #ffffff;
      margin-bottom: 20px;
    }

    .descarga {
      font-family: 'NeueHaas', sans-serif;
      font-weight: 700;
      font-size: 15px;
      color: #ffffff;
      text-decoration: underline;
      text-underline-offset: 3px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .descarga:hover {
      opacity: 0.7;
    }

    .portada {
      width: 200px;
      flex-shrink: 0;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }

    /* VIDEO SECTION */
    .video-section {
      padding: 0 60px 40px 60px;
      max-width: 900px;
      margin: 0 auto;
    }

    .video-section h3 {
      font-family: 'NeueHaas', sans-serif;
      font-weight: 700;
      font-size: 16px;
      color: #ffffff;
      margin-bottom: 16px;
    }

    .video-wrapper {
      border-radius: 20px;
      overflow: hidden;
      background: #000;
      aspect-ratio: 16/9;
    }

    .video-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* FOOTER */
    footer {
      text-align: center;
      padding: 48px 20px;
      font-family: 'NeueHaas', sans-serif;
      font-weight: 400;
      font-size: 13px;
      color: rgba(255,255,255,0.6);
      line-height: 1.8;
    }

    /* RESPONSIVE */
    @media (max-width: 600px) {
      .documento {
        flex-direction: column;
        padding: 60px 30px;
        gap: 30px;
        text-align: center;
      }
      .portada {
        width: 160px;
      }
      .video-section {
        padding: 0 30px 40px 30px;
      }
      .chevron {
        width: 140px;
      }
      .logo {
        width: 220px;
      }
    }
  </style>
</head>
<body>

  <div class="header">
    <img src="amazonas.png" alt="" class="chevron">
    <img src="logonorte.png" alt="Proyecto Norte" class="logo">
  </div>

  <div class="documento">
    <div class="documento-texto">
      <h2>RESUMEN EJECUTIVO</h2>
      <h3>Estrategia de Comunicaciones</h3>
      <a href="resumen-ejecutivo.pdf" download class="descarga">Descarga aquí</a>
    </div>
    <img src="portadaresumen.jpg" alt="Portada Resumen Ejecutivo" class="portada">
  </div>

  <div class="video-section">
    <h3>Spot nueva ruta turística</h3>
    <div class="video-wrapper">
      <iframe
        src="https://www.youtube.com/embed/kzi7bVaJ6O4"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen>
      </iframe>
    </div>
  </div>

  <footer>
    Proyecto Social Norte © 2022<br>
    Web diseñada por: Filmebra
  </footer>

</body>
</html>
